<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>白話字拼讀寫閃卡練習器 李香恩</title>
<style>
  :root {
    --bg: #f8f5f0;
    --card-bg: #ffffff;
    --primary: #1e4d6b;
    --primary-soft: #e6f0f7;
    --syl1-color: #2b6cb0;
    --syl1-bg: #ebf8ff;
    --syl2-color: #2f855a;
    --syl2-bg: #f0fff4;
    --syl3-color: #9c4221;
    --syl3-bg: #fffaf0;
    --syl48-color: #b83280;
    --syl48-bg: #fff5f7;
    --accent: #c05621;
    --accent-soft: #feebc8;
    --neutral-color: #6b46c1;
    --neutral-bg: #faf5ff;
    --text: #2d2622;
    --text-muted: #6b625c;
    --border: #e0d7cc;
    --success: #276749;
    --danger: #c53030;
    --poj-font: "Charis SIL", "Doulos SIL", "Gentium Plus", "Noto Sans", "Segoe UI", Roboto, sans-serif;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    padding: 10px;
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--poj-font);
    line-height: 1.55;
  }

  /* 總寬度增加 30%（860px -> 1118px） */
  .app-shell {
    max-width: 1118px;
    margin: 0 auto;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(30, 77, 107, 0.08);
    overflow: hidden;
  }

  /* 第一列：音節數分類主導覽列（5欄，最右側含「第4,8音字詞」） */
  .syllable-bar {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    padding: 12px 14px;
    background: #f1ebe2;
    border-bottom: 1px solid var(--border);
  }
  .syl-btn {
    border: 2px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 9px 8px;
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
    transition: all 0.18s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .syl-btn .syl-title {
    font-size: 1.38rem;
    font-weight: 700;
  }
  .syl-btn .syl-desc {
    font-size: 0.73rem;
    color: var(--text-muted);
  }
  .syl-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 3px 10px rgba(30, 77, 107, 0.22);
  }
  .syl-btn.active .syl-desc {
    color: rgba(255, 255, 255, 0.85);
  }

  /* 第二列：靠左放置經卷欄位與模式切換選項 */
  .control-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-start;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: #faf7f2;
    border-bottom: 1px solid var(--border);
  }
  .view-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .view-tab {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.86rem;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }
  .view-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* 「馬可福音」、「羅馬書」、「何西阿書」三個欄位：
     寬度同「詞庫總覽」（約 110px），底色與文字顏色同第二列「辨識測驗」（#fff 底、var(--text) 字色） */
  .book-tab {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.86rem;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    min-width: 110px;
  }

  .book-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-left: auto;
  }
  .select-box {
    padding: 5px 9px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: #fff;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
  }

  /* Main Workspace */
  .workspace {
    padding: 14px 16px;
  }
  .hidden {
    display: none !important;
  }

  /* 第三列：左側功能與出處章節 ＋ 最右側調整速度 */
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .progress-badge {
    background: var(--primary-soft);
    color: var(--primary);
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 0.84rem;
    font-weight: 700;
  }
  .mini-btns {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .mini-btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    padding: 5px 10px;
    border-radius: 7px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }
  .mini-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  .verse-tag {
    background: #f0eae1;
    color: #5a5048;
    padding: 5px 11px;
    border-radius: 7px;
    font-size: 0.84rem;
    font-weight: 700;
  }

  /* 第四列（最下方閃卡欄位）：高度減少 50% (295px -> 148px) */
  .flashcard-box {
    background: #fffdf9;
    border: 2px solid var(--border);
    border-radius: 16px;
    min-height: 148px;
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
    user-select: none;
  }
  .flashcard-box:hover {
    border-color: var(--primary);
    box-shadow: 0 6px 18px rgba(30, 77, 107, 0.12);
  }

  /* 閃卡中央同時顯示「漢字」與「白話字」 */
  .card-front-area {
    text-align: center;
    margin: 4px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .big-word {
    font-size: 2.15rem;
    font-weight: 700;
    color: var(--primary);
    line-height: 1.25;
  }
  .sub-word {
    font-size: 2.05rem;
    font-weight: 700;
    color: var(--primary);
    line-height: 1.25;
  }

  /* Back of Flashcard (點擊後展開補充解析) */
  .card-back-area {
    border-top: 1px dashed var(--border);
    padding-top: 12px;
    margin-top: 8px;
    text-align: center;
    animation: slideUp 0.22s ease;
  }

  /* Syllable Breakdown Chips */
  .syllable-chips {
    display: flex;
    justify-content: center;
    align-items: stretch;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .syl-chip {
    background: #fff;
    border: 1.5px solid #d4c8b8;
    border-radius: 10px;
    padding: 5px 10px;
    min-width: 88px;
    text-align: center;
  }
  .syl-chip.sandhi {
    border-color: #d69e2e;
    background: #fffff0;
  }
  .syl-chip.base {
    border-color: #2b6cb0;
    background: #f7fafc;
  }
  .syl-chip.neutral {
    border-color: #805ad5;
    background: var(--neutral-bg);
  }
  .chip-poj {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
  }
  .chip-hanzi {
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .chip-rule {
    display: inline-block;
    margin-top: 2px;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 700;
  }
  .sandhi .chip-rule { background: #fefcbf; color: #975a16; }
  .base .chip-rule { background: #bee3f8; color: #2c5282; }
  .neutral .chip-rule { background: #e9d8fd; color: #553c9a; }

  .card-tip-note {
    display: inline-block;
    background: #f4efe8;
    color: #4a413b;
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 0.84rem;
    margin-bottom: 8px;
  }

  .verse-context-box {
    background: var(--primary-soft);
    border-left: 4px solid var(--primary);
    padding: 8px 12px;
    border-radius: 0 8px 8px 0;
    text-align: left;
    font-size: 0.86rem;
  }
  .verse-context-box .vc-hanzi {
    font-weight: 700;
    color: var(--text);
    margin-bottom: 2px;
  }
  .verse-context-box .vc-poj {
    color: var(--primary);
    font-weight: 600;
  }
  .hl-word {
    background: #fef08a;
    color: #9a3412;
    padding: 0 4px;
    border-radius: 4px;
    font-weight: 700;
  }

  /* Quiz Mode */
  .quiz-box {
    background: #fffdf9;
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 14px 18px;
  }
  .quiz-target-hanzi {
    text-align: center;
    font-size: 1.85rem;
    font-weight: 700;
    color: var(--primary);
    margin: 8px 0 14px 0;
  }
  .quiz-options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 10px;
  }
  .q-opt {
    padding: 10px 14px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: #fff;
    font-family: var(--poj-font);
    font-size: 1.12rem;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .q-opt:hover:not(:disabled) {
    border-color: var(--primary);
    background: var(--primary-soft);
  }
  .q-opt.correct {
    background: #e6fffa;
    border-color: var(--success);
    color: var(--success);
  }
  .q-opt.wrong {
    background: #fff5f5;
    border-color: var(--danger);
    color: var(--danger);
  }
  .quiz-feedback {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.88rem;
  }
  .quiz-feedback.ok { background: #e6fffa; border: 1px solid #9ae6b4; color: #22543d; }
  .quiz-feedback.err { background: #fff5f5; border: 1px solid #feb2b2; color: #742a2a; }

  /* Grid Overview Mode：4 欄漢羅左右並排，且顯示列高度減少 2/3 */
  .grid-list {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    max-height: 380px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .grid-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 14px;
    min-height: 32px;
    background: #fffdf9;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    gap: 18px;
    line-height: 1.25;
  }
  .grid-hanzi {
    font-size: 1.08rem;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
  }
  .grid-poj {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
  }
  .masked {
    filter: blur(5px);
    cursor: pointer;
    user-select: none;
  }
  .masked:hover {
    filter: blur(0);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 820px) {
    .grid-list {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 640px) {
    .syllable-bar {
      grid-template-columns: repeat(2, 1fr);
    }
    .big-word, .sub-word { font-size: 1.75rem; }
    .grid-list {
      grid-template-columns: 1fr;
    }
  }

  /* 閃卡聲調符號：使用透明背景的 POJ 圖檔，與原 0.7rem 字體等高 */
  .tone-symbol { display:inline-block; height:0.7rem; width:auto; max-width:1.15rem; vertical-align:-0.06em; object-fit:contain; }

/* iPhone 15 Plus (430 CSS px) 專用直立響應式排版；其他功能及字詞資料不變 */
@media (max-width: 600px) {
 html { width:100%; -webkit-text-size-adjust:100%; }
 body { width:100%; margin:0; padding:4px; overflow-x:hidden; }
 .app-shell { width:100%; max-width:100%; min-width:0; border-radius:10px; }
 .syllable-bar { grid-template-columns:repeat(5,minmax(0,1fr)); gap:3px; padding:7px 5px; }
 .syl-btn { min-width:0; padding:8px 1px; border-width:1px; border-radius:7px; min-height:49px; }
 .syl-btn .syl-title { font-size:clamp(15px,3.975vw,19.5px); line-height:1.22; overflow-wrap:anywhere; }
 .syl-btn .syl-desc { font-size:10px; }
 .control-bar { display:block; padding:7px 5px; }
 .view-tabs { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; width:100%; }
 .view-tab,.book-tab,.view-tab[style] { width:100%; min-width:0 !important; min-height:39px; padding:7px 2px; font-size:clamp(12px,3vw,14px); line-height:1.2; white-space:normal; }
 .workspace { padding:9px 7px; min-width:0; }
 .status-row { display:flex; flex-direction:column; align-items:stretch; gap:7px; margin-bottom:10px; }
 .mini-btns { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px; width:100%; }
 .mini-btn { min-width:0; min-height:38px; padding:7px 3px; line-height:1.25; font-size:clamp(11px,2.8vw,13px); white-space:normal; }
 .verse-tag { grid-column:1/-1; text-align:center; }
 .filter-group { width:100%; justify-content:center; margin:0; gap:6px; }
 .filter-group select { max-width:100%; }
 .select-box { min-height:36px; font-size:14px; }
 .flashcard-box { width:100%; min-width:0; min-height:175px; padding:12px 8px; border-radius:11px; }
 .card-front-area { width:100%; min-width:0; gap:9px; }
 .big-word,.sub-word { font-size:clamp(26px,8vw,38px); max-width:100%; overflow-wrap:anywhere; text-align:center; }
 .card-back-area { max-width:100%; min-width:0; overflow-wrap:anywhere; }
 .syllable-chips { gap:5px; }
 .syl-chip { min-width:0; max-width:100%; padding:5px 7px; }
 .verse-context-box { overflow-wrap:anywhere; }
 .quiz-box { padding:12px 8px; }
 .quiz-options { grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
 .q-opt { min-width:0; min-height:56px; padding:8px 4px; font-size:clamp(14px,3.8vw,18px); overflow-wrap:anywhere; }
 .quiz-target-hanzi { font-size:clamp(26px,8vw,36px); }
 .grid-list { grid-template-columns:1fr; max-height:60vh; padding-right:2px; }
 .grid-card { min-width:0; gap:10px; padding:8px 10px; }
 .grid-hanzi { flex:0 0 auto; white-space:normal; }
 .grid-poj { min-width:0; white-space:normal; overflow-wrap:anywhere; }
 button,select { touch-action:manipulation; }
}


/* 第二至第六列：欄位名稱較舊版放大 40%；第一列字級維持 */
.control-bar .view-tab, .control-bar .book-tab { font-size: 1.204rem; }
.workspace .mini-btn { font-size: 1.148rem; }
.workspace .verse-tag, .workspace .progress-badge { font-size: 1.176rem; }
.workspace .filter-group label { font-size: 1.176rem !important; }
.workspace .select-box { font-size: 1.19rem; }
.workspace button:not(.mini-btn):not(.q-opt) { font-size: 1.18rem; }
/* iPhone 15 Plus：使用自動換行與適度留白，避免大字擠出畫面 */
@media (max-width:600px) {
 .view-tab,.book-tab,.view-tab[style] { font-size:clamp(16.8px,4.2vw,19.6px); overflow-wrap:anywhere; min-height:50px; padding:8px 2px; }
 .mini-btn { font-size:clamp(15.4px,3.92vw,18.2px); min-height:49px; padding:8px 3px; overflow-wrap:anywhere; }
 .workspace .verse-tag,.workspace .progress-badge { font-size:1.176rem; overflow-wrap:anywhere; }
 .workspace .filter-group label { font-size:1.176rem !important; }
 .workspace .select-box { font-size:19.6px; min-height:45px; }
 .workspace button:not(.mini-btn):not(.q-opt) { overflow-wrap:anywhere; }
}


/* 辨識測驗：題數統計右側直接顯示重洗牌，不再獨占下一列 */
#view-quiz .mini-btns { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-items:stretch; column-gap:0; row-gap:6px; width:100%; }
#view-quiz #qz-status { min-width:0; width:100%; box-sizing:border-box; white-space:normal; text-align:center; display:flex; align-items:center; justify-content:center; border-radius:7px 0 0 7px; }
#view-quiz .quiz-reshuffle { min-width:0; width:100%; box-sizing:border-box; white-space:normal; padding-inline:5px; border-radius:0 7px 7px 0; }
#view-quiz #qz-verse { grid-column:1 / -1; }
@media(max-width:600px) {
 #view-quiz .mini-btns { grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:0; row-gap:5px; }
 #view-quiz #qz-status { padding:7px 3px; font-size:clamp(13px,3.6vw,16px); }
 #view-quiz .quiz-reshuffle { font-size:clamp(14px,3.8vw,17px); min-height:44px; padding:6px 7px; }
}

/* 辨識測驗頁面：中文下方的白話字選項字形放大 50%，不影響其他頁面。 */
#view-quiz .quiz-options .q-opt { font-size: 1.68rem; line-height: 1.3; overflow-wrap: anywhere; }
@media (max-width: 600px) {
  #view-quiz .quiz-options .q-opt { font-size: clamp(21px, 5.7vw, 27px); min-height: 64px; }
}

/* 辨識測驗：章節與速度選單並排各 50%（保留上排題數與重洗牌） */
#view-quiz .status-row { display:block; }
#view-quiz .mini-btns { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px 0; width:100%; }
#view-quiz #qz-verse { grid-column:1; width:100%; min-width:0; box-sizing:border-box; display:flex; align-items:center; justify-content:center; text-align:center; margin:0; white-space:normal; border-radius:7px 0 0 7px; }
#view-quiz .filter-group { grid-column:2; width:100%; min-width:0; box-sizing:border-box; margin:0; padding:5px 4px; display:flex; justify-content:center; align-items:center; gap:4px; flex-wrap:nowrap; border:1px solid var(--border); border-radius:0 7px 7px 0; }
#view-quiz .filter-group label { flex:0 1 auto; white-space:nowrap; font-size:clamp(12px,3.1vw,16px) !important; }
#view-quiz .filter-group select { min-width:0; max-width:65px; width:auto; flex:0 1 auto; padding:5px 2px; font-size:clamp(12px,3.1vw,16px) !important; }


/* 詞庫總覽：兩列獨立配置，避免手機版預設的 .status-row / .mini-btns 干擾 */
#view-grid .grid-overview-top { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); width:100%; gap:0; align-items:stretch; margin-bottom:7px; }
#view-grid #grid-count { box-sizing:border-box; width:100%; min-width:0; display:flex; align-items:center; justify-content:center; text-align:center; white-space:normal; margin:0; padding:7px 4px; border-radius:8px 0 0 8px; font-size:clamp(12px,3.3vw,18px); line-height:1.35; }
#view-grid .grid-overview-top .filter-group { box-sizing:border-box; width:100%; min-width:0; margin:0; padding:6px 3px; display:flex; flex-wrap:nowrap; align-items:center; justify-content:center; gap:3px; border:1px solid var(--border); border-radius:0 8px 8px 0; }
#view-grid .grid-overview-top .filter-group label { white-space:nowrap; font-size:clamp(18px,4.5vw,25.5px) !important; }
#view-grid .grid-overview-top .filter-group select { width:auto; max-width:64px; min-width:0; min-height:38px; padding:4px 2px; font-size:clamp(12px,3vw,17px) !important; }
#view-grid .grid-overview-masks { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; width:100%; margin-bottom:10px; }
#view-grid .grid-overview-masks .mini-btn { box-sizing:border-box; width:100%; min-width:0; margin:0; padding:8px 2px; display:flex; justify-content:center; align-items:center; text-align:center; white-space:normal; overflow-wrap:anywhere; line-height:1.3; font-size:clamp(15px,3.975vw,19.5px); }

// 自動解析白話字音節結構與連讀變調規則
function detectPojTone(rawSyl) {
  const nfd = rawSyl.normalize('NFD');
  if (/\u0301/.test(nfd)) return 2;
  if (/\u0300/.test(nfd)) return 3;
  if (/\u0302/.test(nfd)) return 5;
  if (/\u0304/.test(nfd)) return 7;
  if (/\u030d/.test(nfd)) return 8;
  const clean = rawSyl.replace(/ⁿ$/i, '');
  if (/[ptkh]$/i.test(clean)) return 4;
  return 1;
}

function buildAutoParts(poj, hanzi) {
  const tokens = poj.split(/(--|-)/);
  const syls = [];
  let afterDoubleHyphen = false;

  for (let i = 0; i < tokens.length; i += 2) {
    const raw = tokens[i];
    const prevSep = i > 0 ? tokens[i - 1] : null;
    const nextSep = i + 1 < tokens.length ? tokens[i + 1] : null;

    if (prevSep === '--') afterDoubleHyphen = true;

    let displayP = raw;
    if (prevSep === '--') displayP = '--' + displayP;
    if (nextSep === '-') displayP = displayP + '-';

    let type = 'base';
    if (afterDoubleHyphen) {
      type = 'neutral';
    } else if (nextSep === '-') {
      type = 'sandhi';
    } else {
      type = 'base';
    }

    const tone = detectPojTone(raw);
    const isH = /hⁿ?$/i.test(raw);
    let rule = '';

    if (type === 'neutral') {
      rule = '輕聲';
    } else if (type === 'base') {
      rule = `${tone}調（本調）`;
    } else {
      if (tone === 1) rule = '1調 ➔ 變7調';
      else if (tone === 2) rule = '2調 ➔ 變1調';
      else if (tone === 3) rule = '3調 ➔ 變2調';
      else if (tone === 5) rule = '5調 ➔ 變7調';
      else if (tone === 7) rule = '7調 ➔ 變3調';
      else if (tone === 4) rule = isH ? '4調(-h) ➔ 變2調' : '4調 ➔ 變8調';
      else if (tone === 8) rule = isH ? '8調(-h) ➔ 變3調' : '8調 ➔ 變4調';
    }

    syls.push({ p: displayP, h: '', rule, type, tone });
  }

  const chars = Array.from(hanzi);
  syls.forEach((s, idx) => {
    s.h = chars[idx] || hanzi;
  });

  return syls;
}

function processRawDB(rawList) {
  return rawList.map(item => {
    const chNum = parseInt(String(item.verse).split(':')[0], 10) || 1;
    const parts = item.parts || buildAutoParts(item.poj, item.hanzi);
    const sylNum = Number(item.syl) || parts.length;
    const feature = item.feature || parts.map(pt => pt.rule).join(' ＋ ');
    return { ...item, syl: sylNum, ch: chNum, parts, feature };
  });
}

// 通用陣列徹底隨機洗牌函式 (Fisher-Yates Shuffle)
function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

// 隨機挑選下一個不與目前重複的索引（確保每次跳動都是隨機經節）
function pickRandomNextIndex(currentIdx, length) {
  if (length <= 1) return 0;
  let next = Math.floor(Math.random() * length);
  while (next === currentIdx) {
    next = Math.floor(Math.random() * length);
  }
  return next;
}

// 判斷是否為「第 4、8 音（入聲）字詞」
function isTone48Word(item) {
  if (/[48]調|入聲/.test(item.feature)) return true;
  return item.parts.some(pt => {
    const cleanSyl = pt.p.replace(/^-+|-+$/g, '');
    return /[48]調/.test(pt.rule) || /[ptkh]ⁿ?$/i.test(cleanSyl);
  });
}

function changeSpeed(val) {
  if (val !== undefined) {
    speedSec = parseInt(val, 10);
  }
  document.querySelectorAll('.speed-select').forEach(sel => {
    sel.value = String(speedSec);
  });
  restartAutoTimer();
}

function restartAutoTimer() {
  if (autoTimerId) clearInterval(autoTimerId);
  if (writingHoldTimer) { clearTimeout(writingHoldTimer); writingHoldTimer = null; }
  autoTimerDueAt = Date.now() + speedSec * 1000;
  autoTimerId = setInterval(() => {
    autoTimerDueAt = Date.now() + speedSec * 1000;
    if (currentView === 'card') {
      nextCard();
    } else if (currentView === 'quiz') {
      nextQuiz();
    } else if (currentView === 'grid') {
      // 依所選秒速重新隨機排列詞庫，保留目前的遮字／點擊顯示狀態。
      shuffleGridDisplay();
    }
  }, speedSec * 1000);
}

  activeDeck = shuffleArray(activeDeck);

  quizIdx = Math.floor(Math.random() * activeDeck.length);

  renderAll();

function getFilteredDeck() {
  const pool = BOOK_DB_MAP[currentBookName] || BOOK_DB_MAP['馬可福音'];

  if (currentSyl === 'all') {
    return shuffleArray(pool);
  }

  if (currentSyl === '48') {
    return shuffleArray(pool.filter(item => isTone48Word(item)));
  }

  return shuffleArray(pool.filter(item => item.syl === Number(currentSyl)));
}

function applyFilters() {
  activeDeck = getFilteredDeck();

  // 所有選項一律隨機洗牌並隨機選取起始題
  activeDeck = shuffleArray(activeDeck);
  cardIdx = activeDeck.length ? Math.floor(Math.random() * activeDeck.length) : 0;
  isFlipped = false;
  quizIdx = activeDeck.length ? Math.floor(Math.random() * activeDeck.length) : 0;
  quizCorrect = 0;
  quizDoneSet.clear();
  restartAutoTimer();
  renderAll();
}

function renderAll() {
  if (currentView === 'card') renderFlashcard();

/* 互動閃卡與詞庫總覽的遮字狀態各自獨立。 */
let flashcardMask = 'none';
function setFlashcardMask(mask) {
  if (!['none','poj','hanzi','write'].includes(mask)) return;
  flashcardMask = mask;
  writingAnswerRevealed = false;
  // 每次按下「寫作測試」都立即隨機抽出新題，不沿用上一題或倒數剩餘時間。
  if (mask === 'write' && activeDeck.length > 0) {
    cardIdx = pickRandomNextIndex(cardIdx, activeDeck.length);
    isFlipped = false;
    // 即使詞庫只有一筆資料，也重設輸入區及答題狀態。
    lastRenderedCardKey = null;
  }
  // 以調整速度選取的完整秒數，從此刻重新開始倒數。
  restartAutoTimer();
  ['none','poj','hanzi','write'].forEach(m => {
    const button = document.getElementById('fmask-' + m);
    button.classList.toggle('active', m === mask);
    button.setAttribute('aria-pressed', String(m === mask));
  });
  const entry = document.getElementById('poj-keyboard-entry');
  if (entry) {
    const isWriting = mask === 'write';
    entry.disabled = !isWriting;
    entry.setAttribute('aria-disabled', String(!isWriting));
    entry.placeholder = isWriting ? '在此輸入白話字' : '';
    entry.value = '';
    if (isWriting) entry.focus();
    else entry.blur();
    const keyboard = document.getElementById('poj-tone-keyboard');
    if (keyboard) {
      keyboard.classList.toggle('poj-keyboard-inactive', !isWriting);
      keyboard.querySelectorAll('button').forEach(button => { button.disabled = !isWriting; });
    }
  }
  const msg = document.getElementById('fc-write-feedback');
  if (msg) msg.textContent = '';
  renderFlashcard();
}
function applyFlashcardMask() {
  const hanziEl = direction === 'h2p' ? document.getElementById('fc-front-word') : document.getElementById('fc-second-word');
  const pojEl = direction === 'h2p' ? document.getElementById('fc-second-word') : document.getElementById('fc-front-word');
  hanziEl.classList.remove('fc-poj-enlarged');
  pojEl.classList.add('fc-poj-enlarged');
  hanziEl.classList.add('fc-hanzi-horizontal');
  pojEl.classList.add('fc-poj-horizontal');
  hanziEl.classList.remove('fc-poj-horizontal');
  pojEl.classList.remove('fc-hanzi-horizontal');
  [[hanziEl, 'hanzi'], [pojEl, 'poj']].forEach(([el, type]) => {
    const hidden = flashcardMask === type || (flashcardMask === 'write' && type === 'poj' && !writingAnswerRevealed);
    el.classList.toggle('fc-word-masked', hidden);
    el.setAttribute('aria-label', hidden ? '點擊顯示答案' : el.textContent);
    el.tabIndex = hidden ? 0 : -1;
    el.onclick = hidden ? function(event) {
      event.stopPropagation(); // 顯示答案時不要同時翻卡
      el.classList.remove('fc-word-masked');
      el.setAttribute('aria-label', el.textContent);
    } : null;
    el.onkeydown = hidden ? function(event) {
      if (event.key === 'Enter') { event.preventDefault(); event.stopPropagation(); el.click(); }
    } : null;
  });
}

function shuffleDeck() {
  activeDeck = shuffleArray(activeDeck);
  cardIdx = pickRandomNextIndex(cardIdx, activeDeck.length);
  isFlipped = false;
  restartAutoTimer();
  renderAll();

function highlightTarget(sentence, target) {
  if (!sentence || !target) return sentence;
  const escaped = target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp(escaped, 'i');
  return sentence.replace(regex, match => `<span class="hl-word">${match}</span>`);
}

function renderFlashcard() {
  const item = activeDeck[cardIdx];
  if (!item) {
    document.getElementById('fc-front-word').textContent = '目前沒有符合條件的字詞';
    document.getElementById('fc-second-word').textContent = '請選擇「全部字詞」';
    return;
  }

  // 換題時清空上一題的手寫內容與答對狀態；同一題重繪則保留。
  const renderedKey = getKey(item);
  if (lastRenderedCardKey !== renderedKey) {
    lastRenderedCardKey = renderedKey;
    writingAnswerRevealed = false;
    const input = document.getElementById('poj-keyboard-entry');
    if (input) input.value = '';
    const feedback = document.getElementById('fc-write-feedback');
    if (feedback) feedback.textContent = '';
  }

  // 第三列顯示「聖經出處章節」（隨機顯示）
  document.getElementById('fc-verse').textContent = `${currentBookName} ${item.verse}`;

  const frontWord = document.getElementById('fc-front-word');
  const secondWord = document.getElementById('fc-second-word');

  // 第四列同時顯示「漢字」與「白話字」
  if (direction === 'h2p') {
    frontWord.textContent = item.hanzi;
    secondWord.textContent = item.poj;
  } else {
    frontWord.textContent = item.poj;
    secondWord.textContent = item.hanzi;
  }

function prevCard() {

  isFlipped = false;
  renderFlashcard();
}

function nextCard() {
  if (writingHoldTimer) {clearTimeout(writingHoldTimer); writingHoldTimer = null; restartAutoTimer();}
  if (activeDeck.length === 0) return;
  cardIdx = pickRandomNextIndex(cardIdx, activeDeck.length);
  isFlipped = false;
  renderFlashcard();
}

/* ================= 2. 測驗模式 ================= */
function renderQuiz() {
  const item = activeDeck[quizIdx];
  if (!item) return;

  document.getElementById('qz-status').textContent =
    `共 ${activeDeck.length} 題｜答對：${quizCorrect}`;
  document.getElementById('qz-verse').textContent = `${currentBookName} ${item.verse}`;
  document.getElementById('qz-hanzi').textContent = item.hanzi;

  const optContainer = document.getElementById('qz-options');
  optContainer.innerHTML = '';

  const choices = shuffleArray([item.poj, ...item.distractors]);

  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'q-opt';
    btn.textContent = c;
    btn.onclick = () => checkQuizChoice(btn, c, item);
    optContainer.appendChild(btn);
  });

  const fb = document.getElementById('qz-feedback');
  fb.className = 'quiz-feedback hidden';
  fb.innerHTML = '';
}

function checkQuizChoice(clickedBtn, choice, item) {
  const allBtns = document.querySelectorAll('#qz-options .q-opt');
  allBtns.forEach(b => {
    b.disabled = true;
    if (b.textContent.normalize('NFC') === item.poj.normalize('NFC')) {
      b.classList.add('correct');
    }
  });

  const isOk = choice.normalize('NFC') === item.poj.normalize('NFC');
  if (!isOk) {
    clickedBtn.classList.add('wrong');
  } else {
    quizCorrect++;
  }

  const fb = document.getElementById('qz-feedback');
  fb.className = isOk ? 'quiz-feedback ok' : 'quiz-feedback err';
  fb.innerHTML = `
    <strong>${isOk ? '✅ 答對了！' : '❌ 答錯了！'} 正確白話字：${item.poj}</strong><br>
    ${item.note}<br>
    <span style="color:var(--primary);font-weight:700;">經文對照（${currentBookName} ${item.verse}）：${item.vPoj}</span>
  `;

  document.getElementById('qz-status').textContent =
    `題庫（共 ${activeDeck.length} 題）｜答對：${quizCorrect}`;
}

function prevQuiz() {
  if (activeDeck.length === 0) return;
  quizIdx = pickRandomNextIndex(quizIdx, activeDeck.length);
  renderQuiz();
}

function nextQuiz() {
  if (activeDeck.length === 0) return;
  quizIdx = pickRandomNextIndex(quizIdx, activeDeck.length);
  renderQuiz();
}

function resetQuiz() {
  activeDeck = shuffleArray(activeDeck);
  quizIdx = pickRandomNextIndex(quizIdx, activeDeck.length);
  quizCorrect = 0;
  quizDoneSet.clear();
  restartAutoTimer();
  renderQuiz();
}

/* 在手機上避免每幾秒重建上千個 HTML 元素：
   只重新排列現有詞卡，因此三種模式都會隨秒速自動更新，
   且點擊揭曉的狀態不會被定時器意外清除。 */
function shuffleGridDisplay() {
  if (currentView !== 'grid' || activeDeck.length < 2) return;
  const container = document.getElementById('grid-container');
  const cards = Array.from(container.children);
  if (cards.length < 2) return;
  activeDeck = shuffleArray(activeDeck);
  // Fisher-Yates 打亂畫面中的詞卡順序，並確保最上方不是上一輪同一張。
  const previousFirst = cards[0];
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
[cards[i], cards[j]] = [cards[j], cards[i]];
  }
  if (cards[0] === previousFirst) {
    const j = 1 + Math.floor(Math.random() * (cards.length - 1));
    [cards[0], cards[j]] = [cards[j], cards[0]];
  }
  const fragment = document.createDocumentFragment();
  cards.forEach(card => fragment.appendChild(card));
  container.appendChild(fragment);
  container.scrollTop = 0;
}

/* ================= 3. 總覽列表模式（全部隨機排列顯示） ================= */
function setGridMask(mask) {
  gridMask = mask;
  ['none', 'poj', 'hanzi'].forEach(m => {
    document.getElementById('gmask-' + m).classList.toggle('active', m === mask);
  });
  activeDeck = shuffleArray(activeDeck);
  renderGrid();
  restartAutoTimer();
}

function renderGrid() {
  document.getElementById('grid-count').textContent = `共 ${activeDeck.length} 個字詞（隨機顯示）`;
  const container = document.getElementById('grid-container');
  container.innerHTML = '';

  const fragment = document.createDocumentFragment();
  activeDeck.forEach(item => {
    const card = document.createElement('div');
    card.className = 'grid-card';

    const hanziCls = gridMask === 'hanzi' ? 'grid-hanzi masked' : 'grid-hanzi';
    const pojCls = gridMask === 'poj' ? 'grid-poj masked' : 'grid-poj';

    card.innerHTML = `
      <span class="${hanziCls}" title="${currentBookName} ${item.verse}（點擊可顯影）">${item.hanzi}</span>
      <span class="${pojCls}" title="${currentBookName} ${item.verse}（點擊可顯影）">${item.poj}</span>
    `;

    card.querySelectorAll('.masked').forEach(el => {
      el.onclick = () => el.classList.toggle('masked');
    });

    fragment.appendChild(card);
  });
  container.appendChild(fragment);
}

// 支援鍵盤快捷鍵（空白鍵展開解析、左右鍵隨機換卡）
window.addEventListener('keydown', e => {
  if (currentView !== 'card') return;
  if (e.code === 'Space') {
    e.preventDefault();
    flipCard();
  } else if (e.code === 'ArrowRight') {
    nextCard();
  } else if (e.code === 'ArrowLeft') {
    prevCard();
  }
});

// 掃碼環境診斷：不將無來源資訊的跨來源 Script error 當成本站已確認的故障。
// 增加可檢查的 ?diagnose=1 診斷面板，確認是否真的啟動、是否能執行三種模式。
var pojDiagnostics = { started:false, errors:[], environment:'', lastCheck:'尚未檢查' };
function pojRecordError(kind, error, source, lineno, colno) {
  var message = error && error.message ? error.message : String(error || '未知錯誤');
  var entry = {kind:kind, message:message, source:String(source || ''), line:lineno || 0, column:colno || 0};
  pojDiagnostics.errors.push(entry);
  if (pojDiagnostics.errors.length > 12) pojDiagnostics.errors.shift();
  try { console.warn('POJ 診斷', entry); } catch (_) {}
  pojUpdateDiagnostics();
}
function pojIsOwnScript(source) {
  if (!source) return false;
  try {
    var link = document.createElement('a');
    link.href = source;
    return link.hostname === location.hostname && link.pathname === location.pathname;
  } catch (_) { return false; }
}
function pojUpdateDiagnostics() {
  var panel = document.getElementById('poj-diagnostic');
  if (!panel) return;
  var running = pojDiagnostics.started ? '已成功初始化' : '尚未完成初始化';
  var descriptions = pojDiagnostics.errors.map(function(e, i) {
    return (i + 1) + '. [' + e.kind + '] ' + e.message + (e.source ? ' @ ' + e.source + ':' + e.line : '');
  });
  panel.textContent = '網站狀態：' + running + '\n操作檢查：' + pojDiagnostics.lastCheck + '\n瀏覽器：' + navigator.userAgent + '\n錯誤紀錄：\n' + (descriptions.join('\n') || '無');
}
function pojCreateDiagnostics() {
  if (location.search.indexOf('diagnose=1') === -1) return;
  var panel = document.createElement('pre');
  panel.id = 'poj-diagnostic';
  panel.style.cssText = 'margin:12px auto;max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:#f2f6ff;color:#1c355a;border:1px solid #7e9aca;border-radius:9px;font:12px/1.6 system-ui,sans-serif;';
  panel.setAttribute('aria-label','網站診斷資訊');
  document.body.appendChild(panel);
  pojUpdateDiagnostics();
}
function showStartupError(error) {
  pojRecordError('本站程式', error, location.href, 0, 0);
  var banner = document.getElementById('poj-site-error');
  if (!banner) {
    banner = document.createElement('div');
    banner.id = 'poj-site-error';
    banner.style.cssText = 'position:relative;z-index:10;background:#fff1f0;color:#9b1c1c;padding:10px;font:14px/1.5 sans-serif;white-space:pre-wrap;border:1px solid #ffa7a0';
    document.body.insertBefore(banner, document.body.firstChild);
  }
  banner.textContent = '網站程式錯誤：' + (error && error.message ? error.message : String(error));
}
window.addEventListener('error', function(event) {
  var message = String(event.message || '');
  var source = String(event.filename || '');
  var isOpaque = /^script error\.?$/i.test(message.trim());
  // Brave iOS 已知瀏覽器錢包注入問題：window.ethereum 不存在時，
  // Brave 自己的賦值語句可能丟出 TypeError（brave/brave-browser#58670）。
  // 不把這類瀏覽器錯誤顯示成白話字網站故障；仍保留診斷紀錄。
  var isBraveWalletError = /window\.(?:ethereum|braveEthereum)\.(?:selectedAddress|chainId|networkVersion)\s*=/.test(message)
    && /undefined is not an object|TypeError|cannot set|Cannot set|undefined/i.test(message);
  if (isOpaque || isBraveWalletError || !pojIsOwnScript(source)) {
    // 掃描 App 可能注入跨來源腳本：保留在診斷面板，不讓它覆蓋閃卡操作。
    pojRecordError(isBraveWalletError ? 'Brave 瀏覽器內部問題' : '外部或未定位的腳本', message || 'Script error.', source, event.lineno, event.colno);
    return;
  }
  showStartupError(event.error || (message + '\n' + source + ':' + (event.lineno || 0)));
});
window.addEventListener('unhandledrejection', function(event) {
  var reason = event.reason;
  var msg = String(reason && reason.message ? reason.message : reason || '');
  if (/^script error\.?$/i.test(msg.trim()) || (/window\.(?:ethereum|braveEthereum)\.(?:selectedAddress|chainId|networkVersion)\s*=/.test(msg) && /undefined is not an object|TypeError|cannot set|Cannot set|undefined/i.test(msg))) {
    pojRecordError('來源不明的 Promise 錯誤', msg, '', 0, 0);
    return;
  }
  showStartupError(reason);
});
window.addEventListener('DOMContentLoaded', function() {
  pojCreateDiagnostics();
  try {
    updateBookTabs();
    applyFilters();
    changeSpeed(3);
    pojDiagnostics.started = true;
    pojDiagnostics.lastCheck = '初始化函式已全部執行';
    pojUpdateDiagnostics();
  } catch (error) {
    showStartupError(error);
  }
});
</script>

<section aria-label="聲調與特殊符號鍵盤" class="poj-tone-keyboard" id="poj-tone-keyboard">
<div aria-label="白話字聲調" class="poj-tone-keys" role="group">
<button data-poj-tone="1" type="button"><span class="poj-key-number">1</span><span class="poj-key-glyph">a</span></button>
<button data-poj-tone="2" type="button"><span class="poj-key-number">2</span><span class="poj-key-glyph">á</span></button>
<button data-poj-tone="3" type="button"><span class="poj-key-number">3</span><span class="poj-key-glyph">à</span></button>
<button data-poj-tone="4" type="button"><span class="poj-key-number">4</span><span class="poj-key-glyph">ah</span></button>
<button data-poj-tone="5" type="button"><span class="poj-key-number">5</span><span class="poj-key-glyph">â</span></button>
<button data-poj-tone="7" type="button"><span class="poj-key-number">7</span><span class="poj-key-glyph">ā</span></button>
<button data-poj-tone="8" type="button"><span class="poj-key-number">8</span><span class="poj-key-glyph">a̍h</span></button>
</div>
<div aria-label="特殊符號與編輯" class="poj-special-keys" role="group">
<button data-poj-special="o͘" type="button"><span class="poj-special-hint">打oo也可</span><span class="poj-special-glyph">o͘</span></button>
<button data-poj-special="ⁿ" type="button"><span class="poj-special-hint">打nn也可</span><span class="poj-special-glyph">ⁿ</span></button>
<button data-poj-special="clear" type="button"><span class="poj-special-glyph">清除</span></button>
</div>
<div class="poj-keyboard-caption"><strong>聲調與特殊符號鍵盤</strong><span>先輸入字母，再按聲調，o͘ 和 ⁿ 是字母</span></div>
<div aria-live="polite" class="poj-keyboard-status" id="poj-keyboard-status"></div>
</section>
<script>
/* 來源：白話字螢幕輸入鍵盤；獨立副本只將按鍵輸入送到閃卡左欄。 */
(function(){
  'use strict';
  const root=document.getElementById('poj-tone-keyboard');
  const entry=document.getElementById('poj-keyboard-entry');
  if(!root||!entry) return;
  const combining={2:'\u0301',3:'\u0300',5:'\u0302',7:'\u0304',8:'\u030d'};
  let caret=0;
  const status=document.getElementById('poj-keyboard-status');
  const note=(s)=>{status.textContent=s;};
  function remember(){caret=entry.selectionStart??entry.value.length;}
  function put(text){
    if(entry.disabled)return;
    const start=document.activeElement===entry ? entry.selectionStart : caret;
    const end=document.activeElement===entry ? entry.selectionEnd : caret;
    entry.setRangeText(text,start,end,'end');
    caret=entry.selectionStart;
    entry.dispatchEvent(new Event('input',{bubbles:true}));
  }
  // 把聲調標在最後一個音節的主要母音；符合教羅常用的雙母音規則。
  function addTone(tone){
    if(entry.disabled)return;
    const pos=document.activeElement===entry ? entry.selectionStart : caret;
    const text=entry.value;
    const begin=Math.max(text.lastIndexOf(' ',pos-1),text.lastIndexOf('-',pos-1),text.lastIndexOf('\n',pos-1))+1;
    const syl=text.slice(begin,pos).normalize('NFD');
    if(!syl){note('請先輸入音節，再選聲調');return;}
    const bare=syl.replace(/[\u0300-\u036f]/g,c=>c==='\u0358'?c:'');
    let matches=[...bare.matchAll(/[aeiouAEIOU]/g)];
    let markIndex=-1;
    if(matches.length){
      const lower=bare.toLowerCase();
      // 台語白話字聲調標記優先元音：a / o͘ / e / o，其餘依韻母組合。
      const a=lower.indexOf('a');
      const oo=lower.indexOf('o\u0358');
      const e=lower.indexOf('e');
      const o=lower.indexOf('o');
      if(a>=0)markIndex=a;
      else if(oo>=0)markIndex=oo;
      else if(e>=0)markIndex=e;
      else if(o>=0)markIndex=o;
      else markIndex=matches[0].index;
      // iu / ui 的主元音在後：iū, uī；若僅單獨 i/u 則照原位置。
      if(a<0&&oo<0&&e<0&&o<0 && /(?:iu|ui)$/i.test(lower))markIndex=lower.length-1;
    }else if(/[mnMN]g?\u207F?$/u.test(bare)){
      const mm=[...bare.matchAll(/[mnMN]/g)];markIndex=mm.length?mm[mm.length-1].index:-1;
    }
    if(markIndex<0){note('找不到可標聲調的母音');return;}
    let next=bare;
    if(tone!=='1'&&tone!=='4'){
      const ch=combining[tone];
      next=bare.slice(0,markIndex+1)+ch+bare.slice(markIndex+1);
    }
    if((tone==='4'||tone==='8') && !/[ptkh]$/i.test(next)){
      note('第4、8調通常需要 p、t、k、h 斷音韻尾');
      if(tone==='4')return;
    }else note('');
    entry.setRangeText(next,begin,pos,'end');
    caret=entry.selectionStart;
    entry.dispatchEvent(new Event('input',{bubbles:true}));
  }
  function clear(){if(entry.disabled)return;entry.value='';entry.setSelectionRange(0,0);caret=0;note('');entry.dispatchEvent(new Event('input',{bubbles:true}));}
  entry.addEventListener('click',remember);
  entry.addEventListener('keyup',remember);
  entry.addEventListener('select',remember);
  entry.addEventListener('input',remember);
  entry.addEventListener('keydown',e=>{
    // 原閃卡以空白鍵翻牌、方向鍵換題；在輸入框編輯時應維持一般打字行為。
    e.stopPropagation();
    if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&/^[1234578]$/.test(e.key)){
      e.preventDefault();addTone(e.key);
    }
  });
  root.addEventListener('pointerdown',e=>{if(e.target.closest('button')){if(document.activeElement===entry)remember();e.preventDefault();}});
  root.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||entry.disabled||b.disabled)return;
    if(b.dataset.pojTone)addTone(b.dataset.pojTone);
    if(b.dataset.pojSpecial){if(b.dataset.pojSpecial==='clear')clear();else{put(b.dataset.pojSpecial);note('');}}
  });
  document.querySelector('.fc-front-left')?.addEventListener('click',e=>e.stopPropagation());
  // 關閉寫作模式時鍵盤不接受任何輸入，首次載入亦同。
  root.classList.add('poj-keyboard-inactive');
  root.querySelectorAll('button').forEach(button => {button.disabled=true;});
})();
</script>
<style>
#view-card .fc-mask-row { grid-template-columns: repeat(4, minmax(0,1fr)); }
#view-card #fmask-write.active { background: var(--primary); color: #fff; border-color: var(--primary); }
#view-card .fc-write-feedback { text-align:center; color:var(--primary); font-weight:700; padding:3px 4px; }
#view-card .fc-write-feedback:empty { display:none; }
@media(max-width:390px) { #view-card .fc-mask-row .mini-btn { font-size:clamp(11px,2.7vw,14px); padding:8px 1px; } }
</style>
<script>
(function(){
  function normalized(text){
    return String(text||'').normalize('NFC').trim().toLocaleLowerCase().replace(/[\s‐‑–—]/g,'-').replace(/-+/g,'-');
  }
  function checkWritten(showMistake){
    if (flashcardMask !== 'write' || writingAnswerRevealed) return;
    const input = document.getElementById('poj-keyboard-entry');
    const current = activeDeck[cardIdx];
    const message = document.getElementById('fc-write-feedback');
    if (!input || !current || !message) return;
    const typed = normalized(input.value);
    const correct = !!typed && typed === normalized(current.poj);
    if (!correct) {
      message.textContent = showMistake && typed ? '請再試一次，或點選右側白話字查看答案' : '';
      message.style.color='#a64826';
      return;
    }
    writingAnswerRevealed = true;
    message.textContent = '答對了！完整答案已顯示，至少保留 3 秒';
    message.style.color = '#23714e';
    // 與「全部顯示」同樣顯示完整漢字及白話字，但仍停留在寫作模式。
    applyFlashcardMask();
    const remaining = Math.max(0, autoTimerDueAt - Date.now());
    const holdMs = Math.max(3000, remaining);
    if (autoTimerId) {clearInterval(autoTimerId);autoTimerId=null;}
    if (writingHoldTimer) clearTimeout(writingHoldTimer);
    writingHoldTimer = setTimeout(function(){
      writingHoldTimer = null;
      if (currentView === 'card' && flashcardMask === 'write') {
        nextCard();
      }
      restartAutoTimer();
    },holdMs);
  }
  document.addEventListener('DOMContentLoaded',function(){
    const entry = document.getElementById('poj-keyboard-entry');
    if (!entry) return;
    // 一旦鍵入完整正確白話字就立即顯示答案，不必另外按 Enter。
    entry.addEventListener('input',function(){checkWritten(false);});
    entry.addEventListener('keydown',function(e){
      if(e.key==='Enter' && !e.shiftKey && flashcardMask==='write'){
        e.preventDefault();checkWritten(true);
      }
    });
  });
})();
</script>
